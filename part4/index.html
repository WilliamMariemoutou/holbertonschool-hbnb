<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav>
            <!-- Application logo -->
            <img src="logo.png" alt="HbNB logo" class="logo">

            <!-- Login link -->
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <h1>Available Places</h1>

        <!-- Price filter -->
        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option>All</option>
            </select>
        </section>

        <!-- Places list -->
        <section id="places-list" class="places-container">

            <!-- Place Card -->
            <article class="place-card">
                <h2>Beautiful Beach House</h2>
                <p>Price per night: $150</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Cozy Cabin</h2>
                <p>Price per night: $100</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Modern Apartment</h2>
                <p>Price per night: $200</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2024 HbNB Evolution. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
