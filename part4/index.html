<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav>
        <img src="logo.png" alt="App Logo" class="logo">
        <a href="login.html" id="login-link" class="login-button">Login</a>
    </nav>
</header>

<main>
    <section id="filter">
        <label for="price-filter">Max Price:</label>
        <select id="price-filter">
            <!-- Options will be populated dynamically -->
        </select>
    </section>

    <section id="places-list">
        <!-- List of places will be populated dynamically -->

        <article class="place-card">
            <h2>Sample Place</h2>
            <p>Price per night: $100</p>
            <a href="place.html" class="details-button">View Details</a>
        </article>
    </section>
</main>

<footer>
    <p>All rights reserved</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
