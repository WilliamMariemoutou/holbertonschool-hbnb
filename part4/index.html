<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav>
            <img src="logo.png" alt="HbNB logo" class="logo">
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <h1>Available Places</h1>

        <!-- Price filter -->
        <section id="filter" class="filter-container">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="all">All</option>
            </select>
        </section>

        <!-- Places list -->
        <section id="places-list" class="places-container">
            <!-- JS will populate cards dynamically -->
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2024 HbNB Evolution. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
