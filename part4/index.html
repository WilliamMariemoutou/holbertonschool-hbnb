<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Places</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <header class="header">
            <div class="header-left">
                <img src="logo.png" alt="HbNB logo" class="logo">
                <span class="brand-name">hbnb</span>
            </div>
            <a href="login.html" class="login-link">Login</a>
        </header>
    </nav>
    <main class="container">
        <h1>Available Places</h1>

        <div class="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option>All</option>
                <option>$100</option>
                <option>$150</option>
                <option>$200</option>
            </select>
        </div>

        <section class="cards">
            <article class="place-card">
                <h2>Beautiful Beach House</h2>
                <p>Price per night: $150</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Cozy Cabin</h2>
                <p>Price per night: $100</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Modern Apartment</h2>
                <p>Price per night: $200</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>
        </section>
        <section id="place-list">
            <p class="loading">Loading places...</p>
        </section>
    </main>

    <footer class="footer">
        <p>© 2024 HbNB Evolution. All rights reserved.</p>
    </footer>

</body>

</html>
