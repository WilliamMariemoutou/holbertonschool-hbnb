<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav>
        <img src="logo.png" alt="HbNB logo" class="logo">
        <a href="login.html" class="login-button">Login</a>
    </nav>
</header>

<main>
    <h1>Reviewing: Beautiful Beach House</h1>

    <form id="review-form" class="form">
        <h2>Add a Review</h2>

        <label for="review">Your Review:</label>
        <textarea id="review" name="review" required></textarea>

        <label for="rating">Rating:</label>
        <select id="rating" name="rating" required>
            <option>1 Star</option>
            <option>2 Stars</option>
            <option>3 Stars</option>
            <option>4 Stars</option>
            <option>5 Stars</option>
        </select>

        <button type="submit" class="details-button">Submit Review</button>
    </form>
</main>

<footer>
    <p>© 2024 HbNB Evolution. All rights reserved.</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
