<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav>
        <img src="logo.png" alt="App Logo" class="logo">
        <a href="login.html" class="login-button">Login</a>
    </nav>
</header>

<main>
    <section id="place-details" class="place-details">
        <!-- Place details will be populated dynamically -->

        <!-- Sample static content for structure -->
        <div class="place-info">
            <h2>Sample Place</h2>
            <p>Host: John Doe</p>
            <p>Price per night: $100</p>
            <p>Description: Sample description.</p>
            <p>Amenities: WiFi, AC</p>
        </div>
    </section>

    <section id="reviews">
        <!-- Reviews will be populated dynamically -->

        <!-- Sample review card -->
        <article class="review-card">
            <p>Great place!</p>
            <p>User: Alice</p>
            <p>Rating: 5</p>
        </article>
    </section>

    <section id="add-review" class="add-review">
        <a href="add_review.html" class="details-button">Add Review</a>
    </section>
</main>

<footer>
    <p>All rights reserved</p>
</footer>

<script src="scripts.js"></script>
</body>
</html>
